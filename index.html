    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-container {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .image-item {
            position: relative;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .image-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-name {
            padding: 15px;
            font-size: 0.9rem;
            color: #333;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-item:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin-top: 5%;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #bbb;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>

        let filteredImages = [...images];

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const stats = document.getElementById('stats');
            
            gallery.innerHTML = '';
            
            filteredImages.forEach(imageName => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                
                const img = document.createElement('img');
                img.src = `item/${imageName}`;
                img.alt = imageName;
                img.onerror = function() {
                    this.style.display = 'none';
                };
                
                const imageNameDiv = document.createElement('div');
                imageNameDiv.className = 'image-name';
                imageNameDiv.textContent = imageName;
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Copy URL';
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    const url = `https://raw.githubusercontent.com/[username]/[repository-name]/main/item/${imageName}`;
                    navigator.clipboard.writeText(url).then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => {
                            copyBtn.textContent = 'Copy URL';
                        }, 2000);
                    });
                };
                
                imageItem.appendChild(img);
                imageItem.appendChild(imageNameDiv);
                imageItem.appendChild(copyBtn);
                
                imageItem.onclick = () => {
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    modal.style.display = 'block';
                    modalImg.src = `item/${imageName}`;
                };
                
                gallery.appendChild(imageItem);
            });
            
            stats.textContent = `Hiển thị ${filteredImages.length} / ${images.length} hình ảnh`;
        }

        function filterImages(searchTerm) {
            filteredImages = images.filter(imageName => 
                imageName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            renderGallery();
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterImages(e.target.value);
        });

        // Modal functionality
        const modal = document.getElementById('imageModal');
        const closeBtn = document.getElementsByClassName('close')[0];

        closeBtn.onclick = function() {
            modal.style.display = 'none';
        };

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        };

        // Initialize gallery
        renderGallery();
    </script>
